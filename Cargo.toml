[workspace]
resolver = "3"
members = [
    "crates/nyx-bar-core",
    "apps/bar",
    "apps/plugin",
    "plugins/workspaces",
    "plugins/system",
    "plugins/stats",
    "plugins/panels",
    "plugins/media",
    "plugins/tray",
]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Ken Smith"]
repository = "https://github.com/design-nexus/nyx-bar"

[workspace.dependencies]
anyhow = "1"
async-channel = "2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
gtk4-layer-shell = "0.8"
libc = "0.2"
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "0b511a6e338f4c2c818bad6ebd351ae406578c00", default-features = false }
# The plugin system: nyx-core, and its GTK drawing in nyx-design.
nyx-plugin = { git = "https://github.com/design-nexus/nyx-core.git", rev = "0b511a6e338f4c2c818bad6ebd351ae406578c00" }
nyx-plugin-host = { git = "https://github.com/design-nexus/nyx-core.git", rev = "0b511a6e338f4c2c818bad6ebd351ae406578c00" }
nyx-plugin-protocol = { git = "https://github.com/design-nexus/nyx-core.git", rev = "0b511a6e338f4c2c818bad6ebd351ae406578c00" }
nyx-plugin-sdk = { git = "https://github.com/design-nexus/nyx-core.git", rev = "0b511a6e338f4c2c818bad6ebd351ae406578c00" }
nyx-plugin-view = { git = "https://github.com/design-nexus/nyx-design.git", rev = "ff5895f73d6f486c5470217bc288b9718ea75d15" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "ff5895f73d6f486c5470217bc288b9718ea75d15" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"
toml_edit = "0.25"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
lto = "thin"
strip = true
