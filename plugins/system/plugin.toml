id = "nyx.system"
name = "System status"
version = "0.2.0"
author = "Design Nexus"
license = "MIT"
description = "Network, Bluetooth, volume and battery, usually in one pill. Each opens its Control Center page; right-click opens the dashboard."
api_version = 1
kinds = ["bar"]
exec = ["nyx-bar-system"]

[permissions]
# Documentation for this trusted plugin.
system_talk = ["org.freedesktop.NetworkManager", "org.bluez", "org.freedesktop.UPower", "net.hadess.PowerProfiles"]
session_talk = ["io.github.design_nexus.nyx.ControlCenter"]
host_commands = [["nyx-control-center", "--toggle"], ["nyx-control-center", "--toggle", "wifi"], ["nyx-control-center", "--toggle", "bluetooth"], ["nyx-control-center", "--toggle", "sound"], ["nyx-control-center", "--toggle", "battery"], ["wpctl", "set-mute", "@DEFAULT_AUDIO_SINK@", "toggle"]]

[bar]
mode = "stream"
section = "right"

[[bar.items]]
id = "network"
name = "Network"
default = true

[[bar.items]]
id = "bluetooth"
name = "Bluetooth"
description = "Hidden on computers without Bluetooth."
default = true

[[bar.items]]
id = "volume"
name = "Volume"
description = "Scroll to change it, middle-click to mute."
default = true

[[bar.items]]
id = "battery"
name = "Battery"
description = "Hidden on computers without a battery."
default = true

[settings]
# Show the volume and battery percentages next to their icons.
volume_percent = false
battery_percent = true
