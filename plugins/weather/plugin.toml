id = "nyx.weather"
name = "Weather"
version = "0.2.0"
author = "Design Nexus"
license = "MIT"
description = "Current conditions from Nyx Weather; click for the next hours, five days and alerts."
api_version = 1
kinds = ["bar", "desktop", "control-center"]
exec = ["nyx-bar-weather"]
needs = ["nyx-weather"]

[permissions]
# Documentation for this trusted plugin; a third-party copy would need these.
network = true
host_commands = [["nyx-weather", "--toggle"], ["nyx-weather", "--section", "settings"]]

[bar]
mode = "stream"
section = "right"

[[bar.items]]
id = "now"
name = "Current conditions"
description = "Click for the forecast; right-click opens Nyx Weather."
default = true

[desktop]
exec = ["sh", "weather-desktop.sh"]
mode = "interval"
interval = 600

[[desktop.items]]
id = "card"
name = "Weather card"
description = "Current conditions. Click opens Nyx Weather."
sizes = ["medium", "compact", "large"]
interactive = true
default = true

[control-center]
exec = ["sh", "weather-cc.sh"]
mode = "interval"
interval = 600

[[control-center.items]]
id = "tile"
name = "Weather"
description = "Current conditions. Click opens Nyx Weather."
sizes = ["2x1", "1x1"]
icon = "weather-few-clouds-symbolic"
swatch = "amber"
default = true

[settings]
# In the bar: icon (and temperature), condition, or range (today's high and low).
look = "icon"
