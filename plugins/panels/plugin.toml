id = "nyx.panels"
name = "Panels"
version = "0.2.0"
author = "Design Nexus"
license = "MIT"
description = "The Notification Center bell (unread count, Do not disturb, a quick menu) and the Control Center button."
api_version = 1
kinds = ["bar"]
exec = ["nyx-bar-panels"]

[permissions]
# Documentation for this trusted plugin.
session_talk = ["io.github.design_nexus.nyx.Notifications", "io.github.design_nexus.nyx.ControlCenter"]
host_commands = [["nyx-notification-center", "--toggle"], ["nyx-control-center", "--toggle"], ["nyx-settings", "--section", "notifications"]]

[bar]
mode = "stream"
section = "right"

[[bar.items]]
id = "notifications"
name = "Notifications"
description = "The unread count, a moon in Do not disturb. Right-click for Do not disturb for a while, and Clear."
default = true

[[bar.items]]
id = "control-center"
name = "Control Center"
description = "A button that opens Control Center's dashboard."
default = true
