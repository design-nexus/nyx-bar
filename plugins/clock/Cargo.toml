[package]
name = "nyx-bar-clock"
version = "0.1.0"
description = "Nyx Bar plugin: the date and time, the next event, and a calendar with the day's agenda and reminders"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
nyx-plugin-sdk.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
