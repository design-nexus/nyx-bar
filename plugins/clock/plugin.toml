id = "nyx.clock"
name = "Clock"
version = "0.2.0"
author = "Design Nexus"
license = "MIT"
description = "The date and time with your next event; click for the month, the day's agenda and today's reminders."
api_version = 1
kinds = ["bar", "desktop"]
exec = ["nyx-bar-clock"]

[permissions]
# Documentation for this trusted plugin: Nyx Calendar's and Nyx Reminders' published files.
read = ["~/.local/share/nyx-calendar/agenda.sqlite", "~/.local/share/nyx-reminders/tasks.sqlite"]
host_commands = [["nyx-calendar"]]

[bar]
mode = "stream"
section = "center"

[[bar.items]]
id = "time"
name = "Time and date"
description = "Click for the calendar: the month, the day's agenda and today's reminders."
default = true

[desktop]
exec = ["sh", "clock-desktop.sh"]
mode = "interval"
interval = 60

[[desktop.items]]
id = "large"
name = "Large clock"
description = "The time and date in large type; large adds this month's calendar."
sizes = ["medium", "large", "compact"]
default = true

[settings]
# The date in the bar: short ("Wed Nov 11"), long ("Wednesday, November 11"), numeric
# ("11/11", in your locale's order), iso ("2026-11-11") or none.
date = "short"
# The clock: auto (12-hour where your locale uses one), 12 or 24.
hours = "auto"
# Seconds in the bar's time.
seconds = false
# A strftime(3) format of your own, in place of the three above. A double space splits
# the date (dim) from the time. A format that can't be read is ignored.
format = ""
# The calendar: wide (the month beside the day's agenda) or compact (one column).
layout = "wide"
# monday or sunday.
week_start = "monday"
# The next event beside the time.
next_event = true
# Calendars to show by name; empty shows them all.
calendars = []
# Holidays from holiday calendars.
holidays = true
# Reminder lists to show by name; empty shows them all.
reminder_lists = []
# The desktop clock's time and date.
time_format = "%H:%M"
date_format = "%A, %B %-d"
