id = "nyx.stats"
name = "System stats"
version = "0.2.0"
author = "Design Nexus"
license = "MIT"
description = "CPU, memory, temperature and GPU. Click for graphs, each core, disk, network and the busiest apps; right-click opens Nyx Activity."
api_version = 1
kinds = ["bar", "desktop"]
exec = ["nyx-bar-stats"]

[bar]
mode = "stream"
section = "right"

[[bar.items]]
id = "stats"
name = "CPU, memory and temperature"
default = true

[desktop]
mode = "stream"

[[desktop.items]]
id = "graphs"
name = "System graphs"
description = "CPU, memory and temperature over the last ten minutes."
sizes = ["large", "medium"]
# Or any size in between, dragged in edit mode.
resizable = true
min = [240, 140]
max = [672, 504]
default = true

[settings]
# Seconds between samples.
every = 3
# In the bar: spark (a CPU graph), text (CPU, memory, temperature) or rings.
look = "spark"
# With the spark: memory in use beside it.
memory = true
# Show the GPU when one reports its load.
gpu = true
