[package]
name = "nyx-plugin-sdk"
version = "0.1.0"
description = "Write Nyx plugins in Rust: the event loop, view builders, frames, and live system data"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
dbus = ["dep:zbus"]
network = ["dep:zbus"]
bluetooth = ["dep:zbus"]
power = ["dep:zbus"]
mpris = ["dep:zbus"]
audio = []
gtk = ["dep:gtk", "dep:gtk4-layer-shell"]

[dependencies]
gtk = { workspace = true, optional = true }
gtk4-layer-shell = { workspace = true, optional = true }
libc.workspace = true
nyx-plugin-protocol = { path = "../nyx-plugin-protocol" }
serde.workspace = true
serde_json.workspace = true
zbus = { workspace = true, optional = true }
