[package]
name = "nyx-bar"
version = "0.1.0"
description = "Nyx Bar: a top bar for Hyprland whose every item is a plugin"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-bar"
path = "src/main.rs"

[dependencies]
async-channel.workspace = true
nyx-config.workspace = true
gtk.workspace = true
gtk4-layer-shell.workspace = true
nyx-bar-core = { path = "../../crates/nyx-bar-core" }
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "94e0c8aa133074c74adb31365e51f56168114f68" }
nyx-plugin.workspace = true
nyx-plugin-host.workspace = true
nyx-plugin-protocol.workspace = true
nyx-plugin-view.workspace = true
nyx-theme.workspace = true
nyx-ui-link = { git = "https://github.com/design-nexus/nyx-core.git", rev = "94e0c8aa133074c74adb31365e51f56168114f68" }
serde_json.workspace = true
