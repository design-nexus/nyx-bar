[package]
name = "nyx-bar-backend"
version = "0.1.0"
description = "Nyx Bar without GTK: its plugins and layout, for its Quickshell interface"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-bar-backend"
path = "src/main.rs"

[dependencies]
async-channel.workspace = true
gdk-pixbuf = "0.22"
gio = "0.22"
glib = "0.22"
nyx-bar-core = { path = "../../crates/nyx-bar-core" }
nyx-config.workspace = true
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "166ff17bdb09dd6c5f130fd28ecf81d1f8a59d2d" }
nyx-plugin.workspace = true
nyx-plugin-host.workspace = true
nyx-plugin-protocol.workspace = true
nyx-theme-core = { git = "https://github.com/design-nexus/nyx-design.git", rev = "997a2c17d778e4c667a4f2ab2b1b16e28afcc522" }
nyx-ui-link = { git = "https://github.com/design-nexus/nyx-core.git", rev = "166ff17bdb09dd6c5f130fd28ecf81d1f8a59d2d" }
serde_json.workspace = true
toml.workspace = true
