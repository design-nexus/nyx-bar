[package]
name = "nyx-bar-backend"
version = "0.1.0"
description = "Nyx Bar without GTK: its plugins and layout, for its Quickshell interface"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-bar-backend"
path = "src/main.rs"

[dependencies]
async-channel.workspace = true
gdk-pixbuf = "0.22"
gio = "0.22"
glib = "0.22"
nyx-bar-core = { path = "../../crates/nyx-bar-core" }
nyx-config.workspace = true
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "94e0c8aa133074c74adb31365e51f56168114f68" }
nyx-plugin.workspace = true
nyx-plugin-host.workspace = true
nyx-plugin-protocol.workspace = true
nyx-theme-core = { git = "https://github.com/design-nexus/nyx-design.git", rev = "6c139d893bdb01f3bd87801e08361b3b3c36591e" }
nyx-ui-link = { git = "https://github.com/design-nexus/nyx-core.git", rev = "94e0c8aa133074c74adb31365e51f56168114f68" }
serde_json.workspace = true
toml.workspace = true
