name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: archlinux@sha256:e43f1fd80e073992c5f173efbbbf65144170bf60aeb7369940087d63eacea8f4
    steps:
      - name: Prepare Git checkout
        run: |
          printf 'Server = https://archive.archlinux.org/repos/2026/10/20/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed git
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build prerequisites
        run: bash tools/ci-bootstrap.sh
      - name: Locked build
        run: cargo build --locked --workspace
      - name: Tests
        # The sandbox tests skip themselves where user namespaces aren't allowed.
        run: cargo test --locked --workspace
      - name: Script plugins
        run: |
          for f in plugins/*/*.sh examples/*/*.sh; do bash -n "$f"; done
          python3 -m py_compile sdk/python/nyx_plugin.py examples/hello-py/hello.py examples/cc-ping/ping.py
